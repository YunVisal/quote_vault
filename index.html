<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="./scripts/constant.js"></script>
    <script src="./scripts/theme.js"></script>
    <script src="./scripts/quote.js"></script>
    <title>Quote Vault</title>
  </head>
  <body class="full-height">
    <header>
      <h1 class="title">Quote Vault</h1>
      <button class="theme_toggle_btn"></button>
    </header>
    <main>
      <article>
        <section class="card quote-card">
          <div class="quote">
            <h2 id="quote_content" class="content"></h2>
            <h3 id="quote_author" class="author"></h3>
          </div>
          <div class="action">
            <button id="generate_quote_btn" class="action-btn new-quote-btn">
              <svg
                class="new-quote-btn-icon"
                stroke="currentColor"
                fill="none"
                stroke-width="2"
                viewBox="0 0 24 24"
                stroke-linecap="round"
                stroke-linejoin="round"
                height="1.2rem"
                width="1.2rem"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"
                ></path>
                <path d="M21 3v5h-5"></path>
                <path
                  d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"
                ></path>
                <path d="M8 16H3v5"></path>
              </svg>
              <p>New Quote</p>
            </button>
            <button class="action-btn copy-quote-btn">
              <svg
                class="copy-quote-btn-icon"
                stroke="currentColor"
                fill="none"
                stroke-width="2"
                viewBox="0 0 24 24"
                stroke-linecap="round"
                stroke-linejoin="round"
                height="1.2rem"
                width="1.2rem"
                xmlns="http://www.w3.org/2000/svg"
              >
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                <path
                  d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"
                ></path>
              </svg>
              <p>Copy</p>
            </button>
          </div>
        </section>
      </article>
    </main>
    <footer>Inspiring quotes to brighten your day</footer>

    <script src="./scripts/dom.js"></script>
  </body>
</html>
